# fern production stack — single EC2 instance (app + Caddy).
# Usage:
#   cp .env.example .env.prod   # fill in (see deploy/ec2-user-data.sh for the list)
#   DOMAIN=fernshop.com ACME_EMAIL=admin@fernshop.com docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Notes:
# - NEXT_PUBLIC_* are baked into the image at BUILD time (build.args below).
#   Rebuild after changing them. Server-only secrets (PAYPAL_CLIENT_SECRET,
#   DEEPSEEK_API_KEY, SUPABASE_SERVICE_ROLE_KEY) are runtime-only (environment).
# - Caddy terminates TLS (ports 80/443) and proxies to app:3000. The app itself
#   is NOT exposed to the host — only through Caddy.
# - Caddy data (certs) persist in the `caddy_data` volume — don't delete it.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
    environment:
      # Runtime env (server). NEXT_PUBLIC_* also set here for middleware/SSR reads.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    expose:
      - "3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      # Route53 via instance role (preferred — omit keys). If no instance role,
      # uncomment and set: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION.
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # DNS_PROVIDER=route53 → Caddyfile ; duckdns → deploy/Caddyfile.duckdns
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
